<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Student Coding Club</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>
<body>

  <nav class="navbar md:navbar-expand bg-1">
    <div class="container">
      <a class="navbar-brand" href="index.html">Student Coding Club</a>

      <button type="button" class="btn-icon navbar-toggler"
              data-bs-toggle="drawer" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false"
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
      </button>

      <dialog class="drawer drawer-end" id="navbarNav" tabindex="-1"
              aria-labelledby="navbarNavLabel">
        <div class="drawer-header">
          <p class="drawer-title" id="navbarNavLabel">Menu</p>
          <button type="button" class="btn-close"
                  data-bs-dismiss="drawer" aria-label="Close menu"></button>
        </div>
        <div class="drawer-body">
          <ul class="nav navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#activities">Activities</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="contact.html" aria-current="page">Contact</a>
            </li>
          </ul>
        </div>
      </dialog>
    </div>
  </nav>

  <main class="container mt-4">
    <h1>Contact the Club</h1>

    <form action="contact.html">
      <div class="row g-4">

        <div class="col-12 md:col-6">
          <div class="form-field">
            <label class="form-label" for="firstName">First name (required)</label>
            <input type="text" class="form-control" id="firstName" required>
          </div>
        </div>

        <div class="col-12 md:col-6">
          <div class="form-field">
            <label class="form-label" for="lastName">Last name</label>
            <input type="text" class="form-control" id="lastName">
          </div>
        </div>

        <div class="col-12 md:col-6">
          <div class="form-field">
            <label class="form-label" for="email">Email (required)</label>
            <input type="email" class="form-control" id="email"
                   placeholder="name@example.com" required>
          </div>
        </div>

        <div class="col-12 md:col-6">
          <div class="form-field">
            <label class="form-label" for="topic">Topic</label>
            <select class="form-control" id="topic">
              <option value="joining">Joining the club</option>
              <option value="workshops">Workshops</option>
              <option value="projects">Group projects</option>
            </select>
          </div>
        </div>

        <div class="col-12 md:col-6">
          <div class="form-field">
            <label class="form-label" for="message">Message</label>
            <textarea class="form-control" id="message" rows="4"></textarea>
          </div>
        </div>

        <div class="col-12 md:col-6">
          <div class="form-field">
            <div>
              <input type="checkbox" class="check" id="consent">
              <label for="consent">I agree to be contacted</label>
            </div>
          </div>
        </div>

      </div>

      <button type="submit" class="btn-solid theme-primary mt-4">Submit</button>
    </form>
  </main>

  <footer class="bg-primary fg-contrast-primary text-center p-3 mt-5">
    <p class="mb-0">&copy; 2026 Student Coding Club</p>
  </footer>

</body>
</html>
